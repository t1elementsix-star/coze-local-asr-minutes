name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r volcengine_proxy/requirements.txt httpx
      - name: Compile source
        run: python -m compileall -q local_whisper shared volcengine_proxy transcribe_volc_asr.py
      - name: Import FastAPI applications
        run: python -c "from local_whisper.app import app as local_app; from volcengine_proxy.app import app as proxy_app; print(local_app.title, proxy_app.title)"
      - name: Run tests
        run: python -m pytest
